# DeepSeek balance bundle.
# One Host row owns the polling, the `deepseek_balance` tool, and the same-origin
# route the Client half reads. There is no prompt notice: this bundle is
# display-only, so nothing here is injected into the model's context.
- insert:
    - id: deepseek-balance
      name: '@wasp/dsh-deepseek-balance'
      config:
        # Leave authToken empty to read the DeepSeek sign-in grant the Harness
        # already stored in credentialsFile.
        authToken: ''
        credentialsFile: ''
        # The platform origin that serves the account endpoints.
        platformOrigin: 'https://platform.deepseek.com'
        # Backstop poll for the tool; the page also forces a fresh read on each
        # of its own polls, so the strip stays current.
        refreshSeconds: 300
        # The composer readout shows while the selected model's provider id
        # contains this substring (the account provider is `deepseek-account`).
        providerMatch: 'deepseek'
        # Set true to show the readout for every provider, not just DeepSeek.
        showForAllProviders: false
